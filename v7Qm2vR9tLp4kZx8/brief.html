<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Morning brief</title>
<style>
  :root { --page:#FFFFFF; --card:#CFE8E2; --title:#04342C; --accent:#0F6E56; --track:rgba(255,255,255,0.65);
          --wcard:#FBEBDD; --wtitle:#5A2E07; --waccent:#B4560B;
          --bcard:#F7D4D0; --btitle:#5C1A12; --baccent:#A3321F; }
  @media (prefers-color-scheme: dark) {
    :root { --page:#191919; --card:#1F4D44; --title:#E1F5EE; --accent:#9FE1CB; --track:rgba(255,255,255,0.15);
            --wcard:#4D3017; --wtitle:#FBE3CC; --waccent:#FF9F5A;
            --bcard:#5A2A24; --btitle:#FBE3DF; --baccent:#F2A99C; }
  }
  /* Fills whatever box Notion gives the embed: 4 across, 2 down, text scaled to the box,
     so the phone (narrow, short) and the desktop (wide, tall) both show all eight. */
  html, body { margin: 0; padding: 0; height: 100%; background: var(--page); overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .grid { box-sizing: border-box; height: 100vh; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
          grid-template-rows: repeat(2, minmax(0, 1fr)); gap: min(1.6vw, 3vh); }
  .card { background: var(--card); border-radius: min(2.6vw, 5vh); padding: min(2.2vw, 4.2vh) min(2.4vw, 4.6vh);
          box-sizing: border-box; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .label { color: var(--accent); font-size: max(8px, min(1.8vw, 3.6vh)); font-weight: 700; letter-spacing: 0.06em;
           text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .value { color: var(--title); font-size: min(5vw, 10.5vh); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
           margin-top: min(0.4vw, 0.8vh); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--accent); font-size: max(8px, min(1.9vw, 3.8vh)); line-height: 1.25; margin-top: min(0.5vw, 1vh);
         overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .track { background: var(--track); height: min(1.2vw, 2.4vh); border-radius: 99px; margin-top: auto; overflow: hidden; display: flex; flex: none; }
  .bar { background: var(--accent); height: 100%; }
  .warn { background: var(--wcard); } .warn .label, .warn .sub { color: var(--waccent); } .warn .value { color: var(--wtitle); } .warn .bar { background: var(--waccent); }
  .bad { background: var(--bcard); } .bad .label, .bad .sub { color: var(--baccent); } .bad .value { color: var(--btitle); } .bad .bar { background: var(--baccent); }
  .msg { color: #787774; font-size: 13px; padding: 8px 2px; }
</style>
</head>
<body>
<div id="grid" class="grid"></div>
<script>
  // One morning brief's tiles. The brief embeds brief.html?d=YYYY-MM-DD; the 4:45 AM run writes brief/YYYY-MM-DD.json.
  // Tile: { label, value, sub?, state?: "ok"|"warn"|"bad", bar?: 0-100, parts?: [[name, count], ...], check?: true }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function render(data) {
    const g = document.getElementById("grid"); g.innerHTML = "";
    (data.tiles || []).forEach(t => {
      const c = el("div", "card" + (t.state && t.state !== "ok" ? " " + t.state : ""));
      c.appendChild(el("div", "label", t.label));
      c.appendChild(el("div", "value", (t.check ? (t.state === "bad" ? "✕ " : "✓ ") : "") + t.value));
      const sub = t.parts ? t.parts.map(p => p[0] + " " + p[1]).join(" · ") : t.sub;
      if (sub) c.appendChild(el("div", "sub", sub));
      if (t.bar != null || t.parts) {
        const tr = el("div", "track");
        if (t.parts) {
          const total = t.parts.reduce((s, p) => s + p[1], 0) || 1;
          t.parts.forEach((p, i) => { const b = el("div", "bar"); b.style.width = (100 * p[1] / total) + "%"; b.style.opacity = [1, .7, .45, .28, .18][i] || .15; tr.appendChild(b); });
        } else { const b = el("div", "bar"); b.style.width = Math.max(0, Math.min(100, t.bar)) + "%"; tr.appendChild(b); }
        c.appendChild(tr);
      }
      g.appendChild(c);
    });
  }
  const d = new URLSearchParams(location.search).get("d");
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) document.getElementById("grid").appendChild(el("div", "msg", "No date given."));
  else fetch("brief/" + d + ".json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => document.getElementById("grid").appendChild(el("div", "msg", "Tiles for " + d + " aren't published yet.")));
</script>
</body>
</html>
