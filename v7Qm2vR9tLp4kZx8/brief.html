<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Morning brief</title>
<style>
  :root { --card:#CFE8E2; --title:#04342C; --accent:#0F6E56; --track:rgba(255,255,255,0.65);
          --wcard:#FBEBDD; --wtitle:#5A2E07; --waccent:#B4560B;
          --bcard:#F7D4D0; --btitle:#5C1A12; --baccent:#A3321F; }
  @media (prefers-color-scheme: dark) {
    :root { --card:#1F4D44; --title:#E1F5EE; --accent:#9FE1CB; --track:rgba(255,255,255,0.15);
            --wcard:#4D3017; --wtitle:#FBE3CC; --waccent:#FF9F5A;
            --bcard:#5A2A24; --btitle:#FBE3DF; --baccent:#F2A99C; }
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--card); border-radius: 16px; padding: 12px 16px 14px; box-sizing: border-box; min-width: 0; }
  .label { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .value { color: var(--title); font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; margin-top: 2px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--accent); font-size: 13px; margin-top: 3px; }
  .track { background: var(--track); height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; display: flex; }
  .bar { background: var(--accent); height: 100%; }
  .parts { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 6px; font-size: 12px; color: var(--title); }
  .warn { background: var(--wcard); } .warn .label, .warn .sub { color: var(--waccent); } .warn .value, .warn .parts { color: var(--wtitle); } .warn .bar { background: var(--waccent); }
  .bad { background: var(--bcard); } .bad .label, .bad .sub { color: var(--baccent); } .bad .value, .bad .parts { color: var(--btitle); } .bad .bar { background: var(--baccent); }
  .msg { color: #787774; font-size: 13px; padding: 8px 2px; }
</style>
</head>
<body>
<div id="grid" class="grid"></div>
<script>
  // One morning brief's tiles. The brief embeds brief.html?d=YYYY-MM-DD; the 4:45 AM run writes brief/YYYY-MM-DD.json.
  // Tile: { label, value, sub?, state?: "ok"|"warn"|"bad", bar?: 0-100, parts?: [[name, count], ...], check?: true }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function render(data) {
    const g = document.getElementById("grid"); g.innerHTML = "";
    (data.tiles || []).forEach(t => {
      const c = el("div", "card" + (t.state && t.state !== "ok" ? " " + t.state : ""));
      c.appendChild(el("div", "label", t.label));
      c.appendChild(el("div", "value", (t.check ? (t.state === "bad" ? "✕ " : "✓ ") : "") + t.value));
      if (t.sub) c.appendChild(el("div", "sub", t.sub));
      if (t.bar != null || t.parts) {
        const tr = el("div", "track");
        if (t.parts) {
          const total = t.parts.reduce((s, p) => s + p[1], 0) || 1;
          t.parts.forEach((p, i) => { const b = el("div", "bar"); b.style.width = (100 * p[1] / total) + "%"; b.style.opacity = [1, .7, .45, .28, .18][i] || .15; tr.appendChild(b); });
        } else { const b = el("div", "bar"); b.style.width = Math.max(0, Math.min(100, t.bar)) + "%"; tr.appendChild(b); }
        c.appendChild(tr);
      }
      if (t.parts) { const p = el("div", "parts"); t.parts.forEach(x => p.appendChild(el("span", null, x[0] + " " + x[1]))); c.appendChild(p); }
      g.appendChild(c);
    });
  }
  const d = new URLSearchParams(location.search).get("d");
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) document.getElementById("grid").appendChild(el("div", "msg", "No date given."));
  else fetch("brief/" + d + ".json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => document.getElementById("grid").appendChild(el("div", "msg", "Tiles for " + d + " aren't published yet.")));
</script>
</body>
</html>
