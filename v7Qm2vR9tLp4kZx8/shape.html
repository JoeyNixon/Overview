<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Today's shape</title>
<style>
  :root { --card:#F7F6F3; --txt:#37352F; --mut:#787774; --line:#E3E2E0; --label:#0F6E56;
          --rout:#FBEBC8; --work:#CFE8E2; --home:#E8E1F5; --mtg:#D3E5F7; --mtgEdge:#9CC3EA; --open:#EFEEEC; --now:#E03E3E; }
  @media (prefers-color-scheme: dark) {
    :root { --card:#202020; --txt:#EDEDED; --mut:#9B9B9B; --line:#333333; --label:#9FE1CB;
            --rout:#4D3B17; --work:#1F4D44; --home:#3A2F5A; --mtg:#1D3A5C; --mtgEdge:#3F6E9E; --open:#2A2A2A; --now:#FF5C5C; }
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--txt); }
  .card { background: var(--card); border-radius: 16px; padding: 14px 22px 12px; box-sizing: border-box; }
  .label { color: var(--label); font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 18px; }
  .chart { position: relative; }
  .lane { position: relative; height: 46px; }
  .blk { position: absolute; top: 0; bottom: 0; border-radius: 8px; box-sizing: border-box; padding: 5px 7px;
         overflow: hidden; white-space: nowrap; border: 1px solid var(--card); z-index: 1; }
  .blk .n { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .blk .t { font-size: 11px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; }
  .blk.mtgc { top: 5px; bottom: 5px; z-index: 2; padding: 4px 7px; border: 1px solid var(--mtgEdge); }
  .blk.mtgc .n { font-size: 12px; }
  .blk.mtgc .t { font-size: 10px; }
  .past { opacity: 0.4; }
  .rout { background: var(--rout); } .work { background: var(--work); } .home { background: var(--home); }
  .mtgc { background: var(--mtg); } .openc { background: var(--open); }
  .axis { position: relative; height: 20px; margin-top: 8px; border-top: 1px solid var(--line); }
  .tick { position: absolute; top: 4px; font-size: 11px; color: var(--mut); transform: translateX(-50%); white-space: nowrap; }
  .tick:first-child { transform: none; }
  .nowline { position: absolute; top: -4px; bottom: 28px; width: 3px; margin-left: -1.5px; background: var(--now); border-radius: 2px; z-index: 3; }
  .nowtag { position: absolute; top: -18px; font-size: 11px; font-weight: 700; color: var(--now); transform: translateX(-50%); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="label">TODAY'S SHAPE</div>
  <div id="chart" class="chart">
    <div id="lane" class="lane"></div>
    <div id="axis" class="axis"></div>
    <div id="nowline" class="nowline hidden"></div>
    <div id="nowtag" class="nowtag hidden">now</div>
  </div>
</div>
<script>
  // Reads today's blocks and meetings from the Overview graphic (content.svg, redrawn by the hourly)
  // and lays them out left to right. Meetings sit on top of the block they fall in. The now line moves on its own.
  let items = [], lo = 360, hi = 1320;

  function toMin(s) { const [h, m] = s.trim().split(":").map(Number); return (h % 12) * 60 + (m || 0); }
  function fmt(min) { const h = Math.floor(min / 60), m = min % 60, h12 = ((h + 11) % 12) + 1;
    return h12 + ":" + String(m).padStart(2, "0"); }
  function hourLabel(min) { const h = Math.floor(min / 60), h12 = ((h + 11) % 12) + 1; return h12 + (h < 12 ? " AM" : " PM"); }
  function pct(min) { return (100 * (min - lo) / (hi - lo)); }

  function parse(svgText) {
    const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
    const rects = [...doc.querySelectorAll("rect.blk")], labels = [...doc.querySelectorAll("text.blkl")];
    const out = [];
    rects.forEach((r, i) => {
      const end = Number(r.getAttribute("data-end"));
      const raw = (labels[i] && labels[i].textContent) || "";
      const cut = raw.indexOf(" · ");
      if (cut < 0 || !end) return;
      const [a, b] = raw.slice(0, cut).split("–");
      let dur = ((toMin(b) - toMin(a)) % 720 + 720) % 720; if (dur === 0) dur = 720;
      const kind = ["rout", "work", "home", "mtg", "open"].find(k => r.classList.contains(k)) || "open";
      out.push({ name: raw.slice(cut + 3), start: end - dur, end, kind });
    });
    return out;
  }

  function draw() {
    const lane = document.getElementById("lane"), axis = document.getElementById("axis");
    lane.innerHTML = ""; axis.innerHTML = "";
    if (!items.length) return;
    lo = Math.floor(Math.min(...items.map(b => b.start)) / 60) * 60;
    hi = Math.ceil(Math.max(...items.map(b => b.end)) / 60) * 60;
    items.forEach(b => {
      const el = document.createElement("div");
      el.className = "blk " + (b.kind === "mtg" ? "mtgc" : b.kind === "open" ? "openc" : b.kind);
      el.style.left = pct(b.start) + "%";
      el.style.width = (pct(b.end) - pct(b.start)) + "%";
      el.dataset.end = b.end;
      el.title = fmt(b.start) + " – " + fmt(b.end) + " · " + b.name;
      el.innerHTML = '<div class="n"></div><div class="t"></div>';
      el.querySelector(".n").textContent = b.name;
      el.querySelector(".t").textContent = fmt(b.start) + "–" + fmt(b.end);
      lane.appendChild(el);
    });
    for (let m = lo; m <= hi; m += 180) {
      const t = document.createElement("div");
      t.className = "tick"; t.style.left = pct(m) + "%"; t.textContent = hourLabel(m);
      if (m === hi) t.style.transform = "translateX(-100%)";
      axis.appendChild(t);
    }
    tick();
  }

  function tick() {
    const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
    document.querySelectorAll(".blk").forEach(el => el.classList.toggle("past", Number(el.dataset.end) <= now));
    // hide labels that don't fit their block
    document.querySelectorAll(".blk").forEach(el => {
      const tight = el.offsetWidth < 46;
      el.querySelectorAll(".n, .t").forEach(x => x.style.visibility = tight ? "hidden" : "visible");
    });
    const line = document.getElementById("nowline"), tag = document.getElementById("nowtag");
    const on = items.length && now >= lo && now <= hi;
    line.classList.toggle("hidden", !on); tag.classList.toggle("hidden", !on);
    if (on) { line.style.left = pct(now) + "%"; tag.style.left = pct(now) + "%"; }
  }

  async function load() {
    try {
      const r = await fetch("content.svg?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const parsed = parse(await r.text());
      if (parsed.length) { items = parsed; draw(); }
    } catch (e) { /* keep the last good drawing */ }
  }
  load();
  setInterval(load, 120000);
  setInterval(tick, 30000);
  window.addEventListener("resize", tick);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
