<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Overview</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #g svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div id="g"></div>
<script>
  // This shell never changes. Wide space gets the side-by-side graphic (content.svg),
  // narrow space (a phone) gets the stacked one (stacked.svg). Always fetched past every cache.
  let shown = "";
  function pick() { return window.innerWidth < 700 ? "stacked.svg" : "content.svg"; }
  async function load(force) {
    const file = pick();
    if (!force && file === shown) return;
    try {
      const r = await fetch(file + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) { document.getElementById("g").innerHTML = await r.text(); shown = file; }
    } catch (e) { /* keep showing the last good graphic */ }
  }
  load(true);
  setInterval(() => load(true), 120000);
  window.addEventListener("resize", () => load(false));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });
</script>
</body>
</html>
