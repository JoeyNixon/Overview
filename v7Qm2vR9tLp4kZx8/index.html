<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Overview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  #g, #g svg { display: block; width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="g"></div>
<script>
  // This shell never changes. It pulls the latest graphic past every cache, now and every 2 minutes.
  async function load() {
    try {
      const r = await fetch("content.svg?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) document.getElementById("g").innerHTML = await r.text();
    } catch (e) { /* keep showing the last good graphic */ }
  }
  load();
  setInterval(load, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
