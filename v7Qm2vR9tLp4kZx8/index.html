<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Overview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Fit the whole graphic inside whatever box Notion gives the embed: nothing cut off, nothing to scroll. */
  #g, #g svg { display: block; width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="g"></div>
<script>
  // This shell never changes. A narrow or tall box (a phone) gets the stacked graphic (stacked.svg);
  // a wide box (the Mac) gets the side-by-side one (content.svg). Always fetched past every cache.
  let shown = "";
  function pick() {
    const w = window.innerWidth, h = window.innerHeight;
    return (w < 700 || h > w * 0.9) ? "stacked.svg" : "content.svg";
  }
  async function load(force) {
    const file = pick();
    if (!force && file === shown) return;
    try {
      const r = await fetch(file + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) { document.getElementById("g").innerHTML = await r.text(); shown = file; }
    } catch (e) { /* keep showing the last good graphic */ }
  }
  load(true);
  setInterval(() => load(true), 120000);
  window.addEventListener("resize", () => load(false));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });
</script>
</body>
</html>
