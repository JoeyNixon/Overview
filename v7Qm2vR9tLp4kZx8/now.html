<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Right now</title>
<style>
  :root { --card:#CFE8E2; --title:#04342C; --accent:#0F6E56; --track:rgba(255,255,255,0.65); }
  @media (prefers-color-scheme: dark) {
    :root { --card:#1F4D44; --title:#E1F5EE; --accent:#9FE1CB; --track:rgba(255,255,255,0.15); }
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card { background: var(--card); border-radius: 16px; padding: 16px 22px 18px; box-sizing: border-box; }
  .label { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .title { color: var(--title); font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; margin-top: 2px; }
  .left { color: var(--accent); font-size: 16px; margin-top: 4px; }
  .track { background: var(--track); height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; }
  .bar { background: var(--accent); height: 100%; width: 0; border-radius: 5px; transition: width 0.6s ease; }
  .next { color: var(--title); font-size: 15px; margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="label">RIGHT NOW</div>
  <div id="title" class="title">…</div>
  <div id="left" class="left"></div>
  <div id="track" class="track"><div id="bar" class="bar"></div></div>
  <div id="next" class="next"></div>
</div>
<script>
  // Reads today's blocks and meetings from today.json (written by the hourly) and keeps the card live.
  // A meeting in progress wins over its block; a block ends early when a meeting starts inside it,
  // and picks back up after the meeting.
  let items = [];

  function fmt(min) { const h = Math.floor(min / 60), m = min % 60, h12 = ((h + 11) % 12) + 1;
    return h12 + ":" + String(m).padStart(2, "0"); }
  function dur(min) {
    if (min < 60) return min + (min === 1 ? " minute" : " minutes");
    const h = Math.floor(min / 60), m = min % 60;
    return h + " hr" + (m ? " " + m + " min" : "");
  }

  function render() {
    const t = new Date(), now = t.getHours() * 60 + t.getMinutes();
    const meetings = items.filter(x => x.mtg), blocks = items.filter(x => !x.mtg);

    let cur = meetings.find(m => now >= m.start && now < m.end);
    let curStart, curEnd;
    if (cur) { curStart = cur.start; curEnd = cur.end; }
    else {
      cur = blocks.find(b => now >= b.start && now < b.end);
      if (cur) {
        curEnd = cur.end;
        meetings.forEach(m => { if (m.start > now && m.start < curEnd) curEnd = m.start; });
        curStart = cur.start;
        meetings.forEach(m => { if (m.end <= now && m.end > curStart && m.start >= cur.start) curStart = m.end; });
      }
    }

    const nexts = items.filter(x => x.start > now).map(x => ({ name: x.name, at: x.start }));
    if (cur && cur.mtg) {
      const back = blocks.find(b => b.start < cur.end && b.end > cur.end);
      if (back) nexts.push({ name: back.name, at: cur.end });
    }
    nexts.sort((a, b) => a.at - b.at);
    const next = nexts.find(n => !cur || n.at >= curEnd || n.name !== cur.name);

    const title = document.getElementById("title"), left = document.getElementById("left");
    const track = document.getElementById("track"), bar = document.getElementById("bar"), nx = document.getElementById("next");
    if (cur) {
      title.textContent = cur.name;
      left.textContent = dur(curEnd - now) + " left · ends " + fmt(curEnd);
      bar.style.width = Math.max(2, 100 * (now - curStart) / (curEnd - curStart)).toFixed(1) + "%";
      track.classList.remove("hidden");
    } else if (next) {
      title.textContent = "Open";
      left.textContent = "until " + fmt(next.at);
      track.classList.add("hidden");
    } else {
      title.textContent = "Done for the day";
      left.textContent = "nothing else scheduled";
      track.classList.add("hidden");
    }
    nx.textContent = next ? "Next: " + next.name + " at " + fmt(next.at) : "";
    nx.classList.toggle("hidden", !next);
  }

  async function load() {
    try {
      const r = await fetch("today.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const data = await r.json();
      const parsed = (data.blocks || []).map(b => ({ name: b.name, start: b.start, end: b.end, mtg: b.kind === "mtg" }));
      if (parsed.length) { items = parsed; render(); }
    } catch (e) { /* keep showing the last good card */ }
  }
  load();
  setInterval(load, 120000);
  setInterval(render, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
